<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | महासंघ</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f8fc;color:#172b4d}.wrap{max-width:1100px;margin:auto;padding:32px 20px}h1{color:#17366d}.card{background:#fff;border:1px solid #dfe5ef;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 8px 24px #17366d12}input,button{font:inherit;padding:11px 13px;border-radius:8px;border:1px solid #cbd5e1}input{display:block;width:min(100%,420px);margin:8px 0}button{background:#ff6b00;color:#fff;border:0;cursor:pointer;margin:6px 4px 6px 0}button.secondary{background:#17366d}.hidden{display:none}.status{padding:12px;border-radius:8px;background:#eef4ff;margin:10px 0}.row{display:flex;gap:16px;justify-content:space-between;align-items:center;border-top:1px solid #e5e7eb;padding:16px 0;flex-wrap:wrap}.muted{color:#64748b}.danger{color:#a11}</style></head><body><main class="wrap"><h1>सदस्यत्व प्रशासन</h1><section id="login" class="card"><h2>Admin Login</h2><p class="muted">Admin: padmakarshinde043@gmail.com</p><input id="email" type="email" value="padmakarshinde043@gmail.com" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Login</button><p id="loginStatus" class="status"></p><div id="resetBox" class="hidden"><h3>नवीन password तयार करा</h3><input id="newPassword" type="password" placeholder="नवीन password (किमान 8 अक्षरे)"><button id="resetBtn">Password बदला</button></div></section><section id="dashboard" class="hidden"><div class="card"><div class="row"><div><h2>अर्ज व्यवस्थापन</h2><p id="count" class="muted"></p></div><button class="secondary" id="logoutBtn">Logout</button></div><p id="dashStatus" class="status"></p><div id="applications"></div></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const url='${SUPABASE_URL}',key='${SUPABASE_ANON_KEY}';const sb=createClient(url,key);const ADMIN='padmakarshinde043@gmail.com';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(el,text,error=false){el.textContent=text;el.className='status'+(error?' danger':'')}async function load(){const{data:{user}}=await sb.auth.getUser();if(!user){$('login').classList.remove('hidden');return}if(user.email!==ADMIN){await sb.auth.signOut();msg($('loginStatus'),'फक्त अधिकृत admin ई-मेल वापरा.',true);return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');const{data,error}=await sb.from('membership_applications').select('id,application_number,full_name,honorific,email,whatsapp_number,address,status,member_number,created_at').order('created_at',{ascending:false});if(error){msg($('dashStatus'),error.message,true);return}$('count').textContent=`एकूण अर्ज: ${data.length} | मंजूर सदस्य: ${data.filter(x=>x.status==='approved').length}`;$('applications').innerHTML=data.map(a=>`<article class="row"><div><strong>${esc(a.honorific)} ${esc(a.full_name)}</strong><div class="muted">${esc(a.application_number)} · ${esc(a.email)} · ${esc(a.whatsapp_number)}</div><div>${esc(a.address)}</div><div>स्थिती: <strong>${esc(a.status)}</strong>${a.member_number?' · सदस्य क्रमांक: '+esc(a.member_number):''}</div></div><div>${a.status==='pending'?`<button data-approve="${a.id}">Approve</button>`:''}${a.status==='approved'?`<button class="secondary" data-cert="${a.id}">Certificate Download</button>`:''}</div></article>`).join('')||'<p>अर्ज उपलब्ध नाहीत.</p>'}async function login(){const email=$('email').value.trim();const password=$('password').value;const{error}=await sb.auth.signInWithPassword({email,password});if(error){msg($('loginStatus'),'Login अयशस्वी. प्रथम password 1234 वापरून account तयार/confirm करा.',true);return}if(password==='1234')$('resetBox').classList.remove('hidden');await load()}$('loginBtn').onclick=login;$('resetBtn').onclick=async()=>{const p=$('newPassword').value;if(p.length<8)return msg($('loginStatus'),'Password किमान 8 अक्षरांचा असावा.',true);const{error}=await sb.auth.updateUser({password:p});msg($('loginStatus'),error?error.message:'Password यशस्वीपणे बदलला.');$('resetBox').classList.add('hidden')};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('applications').onclick=async e=>{const id=e.target.dataset.approve;if(id){const member='MS-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();const{error}=await sb.from('membership_applications').update({status:'approved',member_number:member,approved_at:new Date().toISOString()}).eq('id',id);msg($('dashStatus'),error?error.message:`मंजूर केले. सदस्य क्रमांक: ${member}`,!!error);if(!error)load()}const cert=e.target.dataset.cert;if(cert){const{data}=await sb.from('membership_applications').select('full_name,honorific,member_number,approved_at').eq('id',cert).single();if(!data)return;const html=`<!doctype html><html lang="mr"><body style="font-family:serif;text-align:center;padding:80px;border:12px solid #17366d"><h1>सदस्यत्व प्रमाणपत्र</h1><p>महा महाराष्ट्र राज्य महासंघ</p><h2>${esc(data.honorific)} ${esc(data.full_name)}</h2><p>यांना संघटनेचे सदस्यत्व प्रदान करण्यात येत आहे.</p><h2>${esc(data.member_number)}</h2><p>दिनांक: ${new Date(data.approved_at).toLocaleDateString('en-IN')}</p></body></html>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`certificate-${data.member_number}.html`;a.click()}};load();</script></body></html>
